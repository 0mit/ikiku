#
# 1. In the http block (e.g. /etc/nginx/conf.d/places-limit.conf):
#      limit_req_zone $binary_remote_addr zone=places:1m rate=15r/s;
#    Fifteen a second per address is several people typing fast behind one NAT; more is a
#    script, and this machine has one core.
#
# 2. In the ikiku.ir server block, before `location /`:
location = /places/q {
    limit_req zone=places burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8070/places/suggest;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    # The page falls back to Odoo's /places/suggest on anything but a 200, so a responder
    # that is down costs speed, never the form.
    access_log off;   # the query is what somebody typed about where they are
}
# /healthz and /reload stay on 127.0.0.1:8071 and are never proxied.
