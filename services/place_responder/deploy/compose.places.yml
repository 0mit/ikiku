#
# Added beside /opt/ikiku/docker-compose.yml:
#   docker compose -f docker-compose.yml -f compose.places.yml up -d places
# It reaches Postgres on the compose network as `db`, answers on loopback only, and nginx
# puts /places/q in front of it. The limits are the point: this machine has one core and
# 7.8 GiB shared with Odoo and Postgres, and during a reload two indexes are briefly alive.
services:
  places:
    image: ikiku/place-responder:${PLACES_VERSION:?set PLACES_VERSION to the image tag}
    restart: unless-stopped
    depends_on: [db]
    environment:
      PLACES_DSN_FILE: /run/places/places_dsn
      PLACES_LISTEN: 0.0.0.0:8070
      PLACES_ADMIN: 0.0.0.0:8071
      PLACES_LANG: fa_IR
      PLACES_POLL: 10m
      GOMAXPROCS: "1"
      GOMEMLIMIT: 300MiB
    volumes:
      - /opt/ikiku/secrets/places_dsn:/run/places/places_dsn:ro,z
    ports:
      - "127.0.0.1:8070:8070"
      - "127.0.0.1:8071:8071"
    mem_limit: 400m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
